{% extends "base.html" %}
{% block title %}Вход администратора{% endblock %}
{% block body_class %}admin-body{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-card">
    <div class="brand-badge">QR</div>
    <p class="eyebrow">Административная панель</p>
    <h1>Вход в систему</h1>
    <p class="muted">Создание двуязычных страниц с реквизитами и QR-кодов.</p>

    {% include "_flashes.html" %}

    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        <span>Логин</span>
        <input name="username" autocomplete="username" required>
      </label>
      <label>
        <span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button primary wide" type="submit">Войти</button>
    </form>

  </section>
</main>
{% endblock %}
